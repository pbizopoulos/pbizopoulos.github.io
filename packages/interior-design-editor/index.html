<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f3ed" />
    <title>Interior Design Editor</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/",
          "suncalc": "https://esm.sh/suncalc@1.9.0",
          "@lezer/common": "https://esm.sh/@lezer/common@1.5.3",
          "@lezer/lr": "https://esm.sh/@lezer/lr@1.4.10?external=@lezer/common",
          "@codemirror/state": "https://esm.sh/@codemirror/state@6.7.6",
          "@codemirror/view": "https://esm.sh/@codemirror/view@6.43.13?external=@codemirror/state",
          "@codemirror/language": "https://esm.sh/@codemirror/language@6.12.4?external=@codemirror/state,@codemirror/view,@lezer/common,@lezer/lr",
          "@codemirror/commands": "https://esm.sh/@codemirror/commands@6.11.1?external=@codemirror/state,@codemirror/view,@codemirror/language"
        }
      }
    </script>
  </head>
  <body>
    <main class="workspace">
      <section id="layoutPanel" class="editor-panel" aria-label="Layout editor">
        <div class="editor-heading">
          <h1>Interior Design Editor</h1>
          <select id="exampleSelect" aria-label="Design"></select>
        </div>
        <div class="editor-toolbar">
          <div>
            <button
              id="foldButton"
              class="icon-button"
              aria-pressed="false"
              aria-label="Fold layout sections"
              title="Fold layout sections"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m8 3 4 4 4-4M8 21l4-4 4 4M4 10h16M4 14h16" />
              </svg>
            </button>
            <button
              id="copyButton"
              class="icon-button"
              aria-label="Copy layout"
              title="Copy layout"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="9" width="12" height="12" rx="2" />
                <path d="M5 15H3V3h12v2" />
              </svg>
            </button>
          </div>
          <button
            id="assetsButton"
            disabled
            class="icon-button"
            aria-label="Browse assets"
            title="Browse assets"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
              <rect x="14" y="14" width="7" height="7" rx="1" />
            </svg>
          </button>
        </div>
        <div id="editor" aria-label="Design source"></div>
        <div id="message" class="message" role="status" aria-live="polite" hidden></div>
      </section>
      <div
        id="layoutDivider"
        class="layout-divider"
        role="separator"
        tabindex="0"
        aria-label="Resize layout panel"
        aria-orientation="vertical"
        aria-valuemin="22"
        aria-valuemax="55"
        aria-valuenow="30"
      ></div>
      <section id="viewport" class="viewport" aria-label="Interactive 3D preview" aria-busy="true">
        <div class="preview-bar">
          <div class="view-buttons" role="group" aria-label="Camera view">
            <button
              id="resetButton"
              class="active icon-button"
              aria-pressed="true"
              aria-label="3D view"
              title="3D view"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m12 3 9 5v8l-9 5-9-5V8l9-5Zm0 9v9M3 8l9 4 9-4M12 3v9" />
              </svg></button
            ><button
              id="topButton"
              aria-pressed="false"
              class="icon-button"
              aria-label="Floor plan"
              title="Floor plan"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3h18v18H3V3Zm0 9h8V3m0 9v9m0-5h10" />
              </svg></button
            ><button
              id="firstPersonButton"
              aria-pressed="false"
              class="icon-button"
              aria-label="Walk"
              title="Walk"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="13" cy="4" r="2" />
                <path d="m7 13 3-5 4 1 3 4h3M14 9l-2 6 4 6M12 15l-5 6" />
              </svg>
            </button>
          </div>
          <label class="quality-control"
            >Quality
            <select id="renderQuality">
              <option value="high">High</option>
              <option value="balanced">Balanced</option>
              <option value="fast">Fast</option>
            </select></label
          >
        </div>
        <div class="scene-toolbar">
          <select id="roomFocus" aria-label="Focus room"></select
          ><select id="floorFocus" aria-label="Visible floor" hidden></select>
          <button
            id="shareButton"
            class="icon-button"
            aria-label="Share design"
            title="Share design"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="18" cy="5" r="3" />
              <circle cx="6" cy="12" r="3" />
              <circle cx="18" cy="19" r="3" />
              <path d="m9 10 6-3M9 14l6 3" />
            </svg>
          </button>
          <button
            id="saveViewButton"
            class="icon-button"
            aria-label="Export image"
            title="Export image"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <circle cx="8" cy="8" r="1" />
              <path d="m3 17 5-5 4 4 4-6 5 7" />
            </svg>
          </button>
          <details id="sceneOptions">
            <summary>Scene settings</summary>
            <div class="scene-settings">
              <span class="eyebrow">VISIBILITY</span>
              <div class="toggle-grid">
                <button id="wallsButton" aria-pressed="false">Hide walls</button
                ><button id="ceilingsButton" aria-pressed="false">Show ceiling</button
                ><button id="gridButton" aria-pressed="false">Grid</button
                ><button id="lightsButton" aria-pressed="false">Lights on</button
                ><button id="cutawayButton" aria-pressed="false">Hide terrain</button>
              </div>
              <span class="eyebrow">DAYLIGHT</span>
              <form id="sunSettings">
                <label>Date<input id="sunDate" type="date" value="2026-06-21" required /></label
                ><label>Local time<input id="sunTime" type="time" value="15:30" required /></label>
                <label
                  >Latitude<input
                    id="sunLatitude"
                    type="number"
                    min="-90"
                    max="90"
                    step="any"
                    value="37.9838"
                    required /></label
                ><label
                  >Longitude<input
                    id="sunLongitude"
                    type="number"
                    min="-180"
                    max="180"
                    step="any"
                    value="23.7275"
                    required
                /></label>
                <label
                  >UTC offset<input
                    id="sunOffset"
                    type="number"
                    min="-12"
                    max="14"
                    step=".25"
                    value="3"
                    required /></label
                ><label
                  >Orientation °<input
                    id="sunOrientation"
                    type="number"
                    min="0"
                    max="360"
                    value="0"
                    required
                /></label>
                <label
                  >Exposure EV<input
                    id="sunExposure"
                    type="range"
                    min="-2"
                    max="3"
                    step=".25"
                    value="0" /></label
                ><label
                  >Camera exposure<select id="sunExposureMode">
                    <option value="adaptive">Adapt indoors</option>
                    <option value="fixed">Fixed</option>
                  </select></label
                >
                <output id="sunStatus"></output>
              </form>
              <button
                id="fullscreenButton"
                class="icon-button"
                aria-label="Fullscreen"
                title="Fullscreen"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
                </svg></button
              ><button id="walkthroughButton">Walkthrough</button>
            </div>
          </details>
        </div>
        <div id="renderProgress" class="render-progress" role="status">
          <span class="spinner" aria-hidden="true"></span
          ><span id="renderProgressText">Loading…</span>
        </div>
        <div id="selectionCard" class="selection-card" hidden></div>
        <div id="walkLensControl" class="walk-lens" hidden>
          <label for="walkLens">Lens</label
          ><select id="walkLens">
            <option value="60">Natural · 60°</option>
            <option value="75">Wide · 75°</option>
            <option value="90">Ultra wide · 90°</option>
          </select>
        </div>
        <div id="touchNavigation" class="touch-navigation" hidden aria-label="Walk movement">
          <button data-walk-key="w" aria-label="Move forward">↑</button
          ><button data-walk-key="a" aria-label="Move left">←</button
          ><button data-walk-key="s" aria-label="Move backward">↓</button
          ><button data-walk-key="d" aria-label="Move right">→</button>
        </div>
      </section>
    </main>
    <dialog id="assetBrowser" aria-labelledby="assetBrowserTitle">
      <header>
        <div><h2 id="assetBrowserTitle">Assets</h2></div>
        <button
          id="closeAssets"
          class="icon-button"
          aria-label="Close asset library"
          title="Close asset library"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12M6 18 18 6" />
          </svg>
        </button>
      </header>
      <div class="asset-filters">
        <input
          id="assetSearch"
          type="search"
          aria-label="Search assets"
          placeholder="Search furniture, lighting, plants…"
        /><select id="assetCategory" aria-label="Asset category">
          <option value="all">All assets</option>
          <option value="seating">Seating</option>
          <option value="bedroom">Bedroom & storage</option>
          <option value="tables">Tables & desks</option>
          <option value="kitchen">Kitchen</option>
          <option value="bathroom">Bathroom</option>
          <option value="lighting">Lighting</option>
          <option value="garden">Garden</option>
          <option value="decor">Decor & architecture</option>
        </select>
      </div>
      <output id="assetCount"></output>
      <div class="asset-body">
        <div id="assetResults"></div>
        <div class="asset-detail">
          <div id="assetPreview" role="img" aria-label="Furniture preview"></div>
          <h3 id="assetName"></h3>
          <p id="assetDimensions"></p>
          <code id="assetToken"></code>
          <p id="assetContext"></p>
          <button id="copyAsset">Copy token</button>
        </div>
      </div>
    </dialog>
    <script type="module" src="./script.js"></script>
  </body>
</html>
